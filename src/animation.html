<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC ML Trading Bot — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* High-contrast palette optimised for bright presentation rooms */
  --bg:#0a0d1a;
  --card:#ffffff10;
  --card-solid:#141728;
  --card2:#1a1f35;
  --blue:#4f8ef7;--blue-glow:rgba(79,142,247,0.40);--blue-dim:rgba(79,142,247,0.14);
  --green:#00d68f;--red:#ff4f6a;--gold:#ffbe00;--purple:#b48ffb;
  --text:#f0f4ff;--muted:#8898bb;--border:#2a3255;
  --fh:'Oxanium',monospace;--fm:'JetBrains Mono',monospace;
  /* Presentation-safe — very saturated so they pop on projectors */
  --p-green:#00ff99;--p-red:#ff3355;--p-blue:#55aaff;--p-gold:#ffcc00;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--fm);}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(79,142,247,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,142,247,0.03) 1px,transparent 1px);
  background-size:48px 48px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(79,142,247,0.09),transparent);
}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;
  max-width:1180px;margin:0 auto;padding:10px 28px 8px;}

/* PHASES */
.phases{display:flex;gap:5px;align-items:center;padding:5px 0;flex-shrink:0;flex-wrap:wrap;}
.phase-pill{font-family:var(--fm);font-size:13px;font-weight:600;padding:6px 14px;
  border-radius:20px;border:1.5px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .3s;white-space:nowrap;
  letter-spacing:.06em;text-transform:uppercase;}
.phase-pill.active{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 0 20px var(--blue-glow);}
.phase-pill:hover:not(.active){border-color:var(--blue);color:var(--text);}
.phase-sep{color:var(--border);font-size:14px;user-select:none;}

/* HEADER */
.header-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px;flex-shrink:0;}
.step-heading{font-family:var(--fh);font-size:26px;font-weight:700;
  text-align:center;flex:1;letter-spacing:.03em;
  background:linear-gradient(135deg,#ffffff 50%,var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.step-counter{font-family:var(--fm);font-size:14px;color:var(--muted);letter-spacing:.12em;min-width:90px;text-align:right;}

/* CONTENT */
.content-area{flex:1;overflow:hidden;position:relative;min-height:0;}
.step-wrapper{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:absolute;inset:0;}
@keyframes inRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes outLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-50px)}}
@keyframes inLeft{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
@keyframes outRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(50px)}}
.anim-in-r{animation:inRight .38s cubic-bezier(.25,.46,.45,.94) forwards;}
.anim-out-l{animation:outLeft .28s ease-in forwards;}
.anim-in-l{animation:inLeft .38s cubic-bezier(.25,.46,.45,.94) forwards;}
.anim-out-r{animation:outRight .28s ease-in forwards;}

/* NAV */
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0;flex-shrink:0;}
.nav-btn{font-family:var(--fm);font-size:14px;font-weight:700;padding:12px 28px;
  border-radius:8px;border:1.5px solid var(--border);background:var(--card-solid);
  color:var(--text);cursor:pointer;transition:all .2s;letter-spacing:.08em;}
.nav-btn:hover:not(:disabled){border-color:var(--blue);background:var(--blue-dim);color:var(--blue);}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-dots{display:flex;gap:4px;align-items:center;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .3s;}
.nav-dot.active{background:var(--blue);width:16px;border-radius:3px;box-shadow:0 0 8px rgba(79,142,247,.6);}
.nav-dot:hover{background:var(--muted);}

/* SHARED */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card-solid);border:1.5px solid var(--border);border-radius:12px;padding:15px 19px;}
.card.hl{border-color:var(--blue);background:var(--blue-dim);}
.card.gn{border-color:var(--green);background:rgba(0,214,143,.09);}
.card.rd{border-color:var(--red);background:rgba(255,79,106,.09);}
.card.gd{border-color:var(--gold);background:rgba(255,190,0,.10);}

.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}

.dtbl{border-collapse:collapse;width:100%;font-size:14px;}
.dtbl th{background:rgba(79,142,247,.16);color:var(--blue);padding:12px 14px;
  text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1.5px solid var(--border);}
.dtbl td{padding:12px 14px;border-bottom:1px solid rgba(42,50,85,.5);transition:background .2s;}
.dtbl tr:hover td{background:rgba(79,142,247,.06);}
.dtbl .gc{color:var(--green);font-weight:700;}
.dtbl .mc{color:var(--muted);}
.dtbl .hc{color:var(--gold);}
.dtbl .rc{color:var(--red);}
.dtbl .bc{color:var(--blue);}
.dtbl tr.stagger{opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease;}
.dtbl tr.stagger.show{opacity:1;transform:translateX(0);}

.flow-box{background:var(--card-solid);border:1.5px solid var(--border);border-radius:10px;
  padding:14px 20px;text-align:center;font-size:15px;}
.flow-box.blue{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);font-weight:700;}
.flow-box.green{border-color:var(--green);background:rgba(0,214,143,.12);color:var(--green);font-weight:700;}
.flow-box.red{border-color:var(--red);background:rgba(255,79,106,.12);color:var(--red);font-weight:700;}
.flow-arrow{text-align:center;color:var(--muted);font-size:24px;line-height:1.2;}

.acc-bar-wrap{display:flex;align-items:center;gap:10px;}
.acc-bar-bg{flex:1;height:6px;background:rgba(42,50,85,.7);border-radius:3px;overflow:hidden;}
.acc-bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.25,.46,.45,.94);}

.cmp-col{flex:1;border-radius:12px;padding:16px;border:1.5px solid;}
.cmp-col.bad{border-color:rgba(255,79,106,.45);background:rgba(255,79,106,.07);}
.cmp-col.good{border-color:rgba(0,214,143,.45);background:rgba(0,214,143,.07);}

.sw-box{width:42px;height:42px;border-radius:5px;background:rgba(42,50,85,.6);
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--muted);transition:all .35s;flex-shrink:0;}
.sw-box.active{background:rgba(79,142,247,.32);border-color:var(--blue);color:var(--blue);box-shadow:0 0 10px var(--blue-glow);}
.sw-box.target{background:rgba(255,190,0,.22);border-color:var(--gold);color:var(--gold);}

.vote-box{background:var(--card-solid);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 16px;display:flex;align-items:center;gap:12px;transition:all .4s;}
.vote-box.long{border-color:var(--green);background:rgba(0,214,143,.09);}
.vote-box.short{border-color:var(--red);background:rgba(255,79,106,.09);}
.vote-badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:.08em;}
.vote-badge.long{background:var(--green);color:#000;}
.vote-badge.short{background:var(--red);color:#fff;}

.lstm-chain{display:flex;gap:6px;align-items:center;}
.lstm-cell{background:var(--card-solid);border:1.5px solid var(--border);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--muted);transition:all .4s;flex-shrink:0;text-align:center;line-height:1.3;}
.lstm-cell.active{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);box-shadow:0 0 14px var(--blue-glow);}
.lstm-cell.done{border-color:rgba(0,214,143,.5);background:rgba(0,214,143,.1);color:var(--green);}

.cnn-cell{border-radius:4px;background:rgba(42,50,85,.55);border:1.5px solid var(--border);
  transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);}
.cnn-cell.active{background:rgba(79,142,247,.3);border-color:var(--blue);}
.cnn-cell.kernel{background:rgba(79,142,247,.65);border-color:var(--blue);box-shadow:0 0 12px var(--blue-glow);}

.champ-row td{color:var(--gold) !important;font-weight:700 !important;}
.champ-row td:first-child::after{content:' ★';color:var(--gold);}

.step-inner{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:4px 0;}

/* Weight neuron animation */
@keyframes weightPulse{0%,100%{opacity:.4}50%{opacity:1;transform:scale(1.15)}}
.w-neuron{transition:all .4s;}
.w-neuron.active{animation:weightPulse .7s ease infinite;}

/* Gate flow animation */
@keyframes flowSlide{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.gate-flow{stroke-dasharray:10 6;animation:flowSlide .8s linear infinite;}
</style>
</head>
<body>
<div class="app">
  <div class="phases" id="phases"></div>
  <div class="header-row">
    <div style="width:100px"></div>
    <div class="step-heading" id="stepHeading"></div>
    <div class="step-counter" id="stepCounter"></div>
  </div>
  <div class="content-area" id="contentArea">
    <div class="step-wrapper" id="stepWrapper"></div>
  </div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← PREV</button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">NEXT →</button>
  </div>
</div>

<script>
const PHASES=['Data Collection','Feature Engineering','Preprocessing','Model Architecture','Training & Ensemble','Backtest Logic'];

function fu(d=0,e=''){return `style="opacity:0;animation:fadeUp .5s ease ${d}ms forwards;${e}"`;}
function card(cls='',content='',delay=0){return `<div class="card ${cls}" ${fu(delay)}>${content}</div>`;}
function lbl(t){return `<div class="lbl">${t}</div>`;}

function seeded(s){let x=Math.sin(s+1)*10000;return x-Math.floor(x);}
function generateEquityCurve(pts=200){
  let eq=1000;const arr=[eq];
  for(let i=1;i<pts;i++){
    const r=seeded(i*7+13);const isWin=r<0.5204;
    const tier=eq<1500?750:eq<3000?1000:eq<5000?1300:1600;
    const recentWins=arr.slice(Math.max(0,arr.length-20)).filter((v,j,a)=>j>0&&v>a[j-1]).length;
    const recentLen=Math.min(20,arr.length);const wr=recentLen>0?recentWins/recentLen:0.5;
    const vel=Math.min(2,Math.max(0.3,1+(wr-0.5)*4));const bet=tier*vel*0.0018;
    const change=isWin?bet*(0.6+seeded(i*3)*0.8):-bet*(0.5+seeded(i*5)*0.7);
    eq=Math.max(700,eq+change);arr.push(eq);
  }
  const cur=arr[arr.length-1];const factor=(4822-1000)/(cur-1000);
  return arr.map((v,i)=>i===0?1000:Math.max(600,1000+(v-1000)*factor));
}

const STEPS=[

// ── STEP 0 ── Raw BTC Data
{phase:0,heading:'Raw BTC Market Data',
render(){return `<div class="step-inner">
  <div ${fu(0)} style="width:100%;max-width:860px;background:var(--card-solid);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;">
    <table class="dtbl">
      <thead><tr><th>TIMESTAMP</th><th>OPEN</th><th>HIGH</th><th>LOW</th><th>CLOSE</th><th>VOLUME</th></tr></thead>
      <tbody id="raw-tbody">
        <tr class="stagger"><td>2023-01-01 00:00 UTC</td><td>16,541.2</td><td class="hc">16,557.8</td><td class="rc">16,528.0</td><td class="gc">16,549.3</td><td class="mc">342.81</td></tr>
        <tr class="stagger"><td>2023-01-01 00:15 UTC</td><td>16,549.3</td><td class="hc">16,572.1</td><td class="rc">16,540.0</td><td class="gc">16,563.7</td><td class="mc">289.44</td></tr>
        <tr class="stagger"><td>2023-01-01 00:30 UTC</td><td>16,563.7</td><td class="hc">16,580.2</td><td class="rc">16,551.4</td><td class="gc">16,571.0</td><td class="mc">301.22</td></tr>
        <tr class="stagger"><td>2023-01-01 00:45 UTC</td><td>16,571.0</td><td class="hc">16,590.5</td><td class="rc">16,558.8</td><td class="gc">16,565.4</td><td class="mc">278.90</td></tr>
        <tr class="stagger"><td>2023-01-01 01:00 UTC</td><td>16,565.4</td><td class="hc">16,576.3</td><td class="rc">16,541.1</td><td class="gc">16,548.9</td><td class="mc">264.17</td></tr>
        <tr class="stagger" style="opacity:.4"><td colspan="6" style="text-align:center;color:var(--muted);font-size:11px;">... ~275,000 rows total ...</td></tr>
      </tbody>
    </table>
  </div>
  <div style="display:flex;gap:12px;justify-content:center;" ${fu(150)}>
    ${[['TOTAL ROWS','~275,000','candles','var(--blue)'],['TIME RANGE','~2 YEARS','15-min BTC/USDT','var(--text)'],['FILE SIZE','~38 MB','CSV format','var(--muted)']].map(([l,v,s,c])=>`
    <div style="background:var(--card-solid);border:1.5px solid var(--border);border-radius:10px;padding:13px 18px;text-align:center;min-width:155px;">
      <div class="lbl">${l}</div>
      <div style="font-size:20px;font-weight:700;color:${c};margin:4px 0;">${v}</div>
      <div style="font-size:10px;color:var(--muted);">${s}</div>
    </div>`).join('')}
  </div>
  <div ${fu(250)} style="background:rgba(79,142,247,.09);border:1.5px solid rgba(79,142,247,.25);border-radius:8px;padding:10px 20px;text-align:center;font-size:11px;color:var(--muted);">
    1 candle = 15 min &nbsp;·&nbsp; 4 candles = 1 hour &nbsp;·&nbsp; 96 candles = 1 day
  </div>
</div>`;},
onMount(){let i=0;const rows=document.querySelectorAll('#raw-tbody tr.stagger');function showNext(){if(i<rows.length){rows[i].classList.add('show');i++;setTimeout(showNext,120);}}setTimeout(showNext,300);}},

// ── STEP 1 ── Train/Test Split
{phase:0,heading:'Chronological Train / Test Split',
render(){return `<div class="step-inner">
  <div ${fu(0)} style="width:100%;max-width:860px;">
    <div style="margin-bottom:8px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);">
      <span>Jan 2021</span><span style="color:var(--blue);">~Oct 2024</span><span>Feb 2025</span>
    </div>
    <div style="height:54px;display:flex;border-radius:10px;overflow:hidden;background:rgba(42,50,85,.4);border:1.5px solid var(--border);">

        display:flex;align-items:center;padding:0 18px;font-size:11.5px;font-weight:700;color:#fff;
        transition:width 1.6s cubic-bezier(.25,.46,.45,.94);white-space:nowrap;overflow:hidden;">
        <span id="train-lbl" style="opacity:0;transition:opacity .5s .8s;">TRAINING DATA — 240,000 candles — 83%</span>
      </div>

        transition:width 1.6s cubic-bezier(.25,.46,.45,.94) .1s;white-space:nowrap;overflow:hidden;">
        <span id="test-lbl" style="opacity:0;transition:opacity .5s .9s;">TEST — 35,903 — 17%</span>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:14px;width:100%;max-width:860px;" ${fu(200)}>
    <div class="card hl" style="flex:1;">
      <div class="lbl" style="color:var(--blue);">TRAINING SET</div>
      <div style="font-size:22px;font-weight:700;color:var(--blue);margin:4px 0;">240,000 candles</div>
      <div style="font-size:11px;color:var(--muted);">83% of data · Used to TEACH the models</div>
    </div>
    <div class="card gd" style="flex:1;">
      <div class="lbl" style="color:var(--gold);">TEST SET</div>
      <div style="font-size:22px;font-weight:700;color:var(--gold);margin:4px 0;">35,903 candles</div>
      <div style="font-size:11px;color:var(--muted);">17% of data · NEVER seen during training</div>
    </div>
  </div>
  <div ${fu(350)} style="background:rgba(255,190,0,.08);border:1.5px solid rgba(255,190,0,.3);border-radius:14px;padding:24px 32px;max-width:900px;text-align:center;margin-top:16px;">
    <div style="color:var(--gold);font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-weight:700;">WHY NOT RANDOM SPLIT?</div>

      <strong style="color:var(--gold);">Rule:</strong> Always split by time — train on the past, test on the future.
    </div>
  </div>
</div>`;},
onMount(){setTimeout(()=>{
  const t=document.getElementById('train-bar'),ts=document.getElementById('test-bar');
  if(t){t.style.width='83%';document.getElementById('train-lbl').style.opacity='1';}
  if(ts){ts.style.width='17%';document.getElementById('test-lbl').style.opacity='1';}
},200);}},

{phase:1,heading:'Raw Prices Are Not Comparable Across Time',
render(){return `<div class="step-inner">

      </div>

        Highest equity among safe versions ($4,822) · Reasonable drawdown (8.47%) · Proven adaptive behavior via velocity scoring. Best <strong style="color:var(--gold);">balance</strong> of all metrics.
      </div>
    </div>
  </div>`;},
onMount(){let i=0;const rows=document.querySelectorAll('#ver-tbody tr.stagger');function show(){if(i<rows.length){rows[i].classList.add('show');i++;setTimeout(show,110);}}setTimeout(show,200);}},

// ── STEP 19 ── Final Results
{phase:5,heading:'From $1,000 to $4,822 — 374 Days Simulated',

  const pathD='M'+pts.join(' L');
  const peakIdx=curve.indexOf(maxEq);
  const peakX=pad+(peakIdx/(curve.length-1))*(W-pad*2);
  const peakY=H-pad-(maxEq-minEq)/range*(H-pad*2);
  return `<div class="step-inner">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

        <path d="${pathD} L${W-pad},${H-pad} L${pad},${H-pad} Z" fill="url(#eq-grad)" opacity="0" id="eq-area"/>
        <path d="${pathD}" stroke="var(--green)" stroke-width="2.5" fill="none" id="eq-line"/>
        <circle id="peak-dot" cx="${peakX}" cy="${peakY}" r="5" fill="var(--gold)" opacity="0" stroke="var(--bg)" stroke-width="2"/>
        <text id="peak-lbl" x="${Math.min(peakX+8,W-80)}" y="${peakY-12}" fill="var(--gold)" font-size="12" font-family="JetBrains Mono" font-weight="700" opacity="0">PEAK $${Math.round(maxEq).toLocaleString()}</text>
        <circle cx="${W-pad}" cy="${H-pad-(4822-minEq)/range*(H-pad*2)}" r="5" fill="var(--green)" id="end-dot" opacity="0" stroke="var(--bg)" stroke-width="2"/>
        <defs>
          <linearGradient id="eq-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00d68f" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#00d68f" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px;">
        <span>Day 0</span><span>Day 93</span><span>Day 187</span><span>Day 280</span><span>Day 374</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:960px;" ${fu(200)}>
      ${[['FINAL EQUITY','$4,822','var(--green)'],['TOTAL RETURN','+382%','var(--gold)'],['WIN RATE','52.04%','var(--blue)'],['MAX DRAWDOWN','8.47%','var(--red)'],['PROFIT FACTOR','1.144','var(--text)']].map(([l,v,c],i)=>`
      <div class="card" ${fu(i*80+300)} style="text-align:center;border-color:${c}22;padding:16px;">
        <div class="lbl" style="font-size:12px;">${l}</div>

      <div class="card" style="padding:20px;">
        <div class="lbl" style="margin-bottom:12px;font-size:12px;font-weight:700;">ML ACCURACY (all candles)</div>
        ${[['Accuracy','51.91%','var(--blue)'],['Precision','0.5166','var(--muted)'],['Recall','0.6113','var(--muted)'],['F1','0.5600','var(--muted)']].map(([l,v,c])=>`

onMount(){
  const line=document.getElementById('eq-line'),area=document.getElementById('eq-area');

  if(line){const len=line.getTotalLength()||2500;line.style.strokeDasharray=len;line.style.strokeDashoffset=len;setTimeout(()=>{line.style.transition=`stroke-dashoffset 2.5s cubic-bezier(.25,.46,.45,.94)`;line.style.strokeDashoffset='0';},300);setTimeout(()=>{if(peak){peak.style.opacity='1';peak.style.transition='opacity .4s';}if(peakLbl){peakLbl.style.opacity='1';peakLbl.style.transition='opacity .4s';}if(endDot){endDot.style.opacity='1';endDot.style.transition='opacity .4s';}},2900);}
  if(area){setTimeout(()=>{area.style.transition='opacity 1.5s ease 1s';area.style.opacity='0.3';},400);}
}},
];

const PHASES_LIST=['Data Collection','Feature Engineering','Preprocessing','Model Architecture','Training & Ensemble','Backtest Logic'];
const PHASE_RANGES=[[0,1],[2,4],[5,6],[7,10],[11,13],[14,19]];
function getPhaseForStep(i){for(let p=0;p<PHASE_RANGES.length;p++){if(i>=PHASE_RANGES[p][0]&&i<=PHASE_RANGES[p][1])return p;}return 0;}

let current=0,busy=false,mountTimer=null;

function renderPhases(){
  const el=document.getElementById('phases'),phase=getPhaseForStep(current);
  el.innerHTML=PHASES_LIST.map((p,i)=>`<button class="phase-pill${i===phase?' active':''}" onclick="jumpToPhase(${i})">${p}</button>${i<PHASES_LIST.length-1?'<span class="phase-sep">›</span>':''}`).join('');
}
function renderNavDots(){
  const el=document.getElementById('navDots');
  el.innerHTML=STEPS.map((_,i)=>`<div class="nav-dot${i===current?' active':''}" onclick="goTo(${i})"></div>`).join('');
}
function renderButtons(){
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===STEPS.length-1;
}
function renderStep(idx,dir=1){
  const step=STEPS[idx];
  document.getElementById('stepHeading').textContent=step.heading;
  document.getElementById('stepCounter').textContent=`Step ${idx+1} of ${STEPS.length}`;
  const wrapper=document.getElementById('stepWrapper');
  wrapper.innerHTML=step.render();
  wrapper.className='step-wrapper '+(dir>=0?'anim-in-r':'anim-in-l');
  if(mountTimer)clearTimeout(mountTimer);
  mountTimer=setTimeout(()=>{step.onMount&&step.onMount();},50);
}
function goTo(idx,dir){
  if(busy||idx===current||idx<0||idx>=STEPS.length)return;
  busy=true;if(dir===undefined)dir=idx>current?1:-1;
  const wrapper=document.getElementById('stepWrapper');
  wrapper.className='step-wrapper '+(dir>0?'anim-out-l':'anim-out-r');
  setTimeout(()=>{current=idx;renderStep(current,dir);renderPhases();renderNavDots();renderButtons();setTimeout(()=>{busy=false;},400);},270);
}
function navigate(dir){goTo(current+dir,dir);}
function jumpToPhase(p){goTo(PHASE_RANGES[p][0],p>getPhaseForStep(current)?1:-1);}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')navigate(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')navigate(-1);
});

renderPhases();renderNavDots();renderButtons();renderStep(0,1);
</script>
