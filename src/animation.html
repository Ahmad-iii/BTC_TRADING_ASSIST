<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC ML Trading Bot — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--card:#1a1d2e;--card2:#1e2235;
  --blue:#3b82f6;--blue-glow:rgba(59,130,246,0.35);--blue-dim:rgba(59,130,246,0.12);
  --green:#10b981;--red:#ef4444;--gold:#f59e0b;--purple:#a78bfa;
  --text:#f1f5f9;--muted:#64748b;--border:#2d3748;
  --fh:'Oxanium',monospace;--fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--fm);}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(59,130,246,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,0.025) 1px,transparent 1px);
  background-size:48px 48px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,0.06),transparent);
}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;
  max-width:1160px;margin:0 auto;padding:12px 28px 10px;}

/* === PHASES === */
.phases{display:flex;gap:5px;align-items:center;padding:6px 0;flex-shrink:0;flex-wrap:wrap;}
.phase-pill{
  font-family:var(--fm);font-size:9.5px;font-weight:600;padding:5px 11px;
  border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .3s;white-space:nowrap;
  letter-spacing:.06em;text-transform:uppercase;
}
.phase-pill.active{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 0 18px var(--blue-glow);}
.phase-pill:hover:not(.active){border-color:var(--blue);color:var(--text);}
.phase-sep{color:var(--border);font-size:10px;user-select:none;}

/* === HEADER === */
.header-row{display:flex;justify-content:space-between;align-items:center;
  margin:6px 0 8px;flex-shrink:0;}
.step-heading{font-family:var(--fh);font-size:20px;font-weight:700;
  text-align:center;flex:1;letter-spacing:.03em;
  background:linear-gradient(135deg,var(--text) 60%,var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.step-counter{font-family:var(--fm);font-size:11px;color:var(--muted);
  letter-spacing:.12em;min-width:90px;text-align:right;}

/* === CONTENT === */
.content-area{flex:1;overflow:hidden;position:relative;min-height:0;}
.step-wrapper{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;position:absolute;inset:0;}
@keyframes inRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes outLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-50px)}}
@keyframes inLeft{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
@keyframes outRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(50px)}}
.anim-in-r{animation:inRight .38s cubic-bezier(.25,.46,.45,.94) forwards;}
.anim-out-l{animation:outLeft .28s ease-in forwards;}
.anim-in-l{animation:inLeft .38s cubic-bezier(.25,.46,.45,.94) forwards;}
.anim-out-r{animation:outRight .28s ease-in forwards;}

/* === NAV === */
.nav-bar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;flex-shrink:0;}
.nav-btn{font-family:var(--fm);font-size:11px;font-weight:700;padding:9px 22px;
  border-radius:8px;border:1px solid var(--border);background:var(--card);
  color:var(--text);cursor:pointer;transition:all .2s;letter-spacing:.08em;}
.nav-btn:hover:not(:disabled){border-color:var(--blue);background:var(--blue-dim);color:var(--blue);}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-dots{display:flex;gap:4px;align-items:center;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--border);
  cursor:pointer;transition:all .3s;}
.nav-dot.active{background:var(--blue);width:16px;border-radius:3px;
  box-shadow:0 0 8px rgba(59,130,246,.6);}
.nav-dot:hover{background:var(--muted);}

/* === SHARED ELEMENTS === */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{opacity:0;animation:fadeUp .5s ease forwards;}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;}
.card.hl{border-color:var(--blue);background:var(--blue-dim);}
.card.gn{border-color:var(--green);background:rgba(16,185,129,.08);}
.card.rd{border-color:var(--red);background:rgba(239,68,68,.08);}
.card.gd{border-color:var(--gold);background:rgba(245,158,11,.1);}

.mono{font-family:var(--fm);}
.lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.big{font-family:var(--fm);font-size:26px;font-weight:700;}
.sm{font-size:10px;color:var(--muted);margin-top:3px;}

/* Data table */
.dtbl{border-collapse:collapse;width:100%;font-size:11.5px;}
.dtbl th{background:rgba(59,130,246,.12);color:var(--blue);padding:9px 13px;
  text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid var(--border);}
.dtbl td{padding:9px 13px;border-bottom:1px solid rgba(45,55,72,.4);
  transition:background .2s;}
.dtbl tr:hover td{background:rgba(59,130,246,.05);}
.dtbl .gc{color:var(--green);font-weight:700;}
.dtbl .mc{color:var(--muted);}
.dtbl .hc{color:var(--gold);}
.dtbl .rc{color:var(--red);}
.dtbl .bc{color:var(--blue);}
.dtbl tr.stagger{opacity:0;transform:translateX(-8px);
  transition:opacity .3s ease,transform .3s ease;}
.dtbl tr.stagger.show{opacity:1;transform:translateX(0);}

/* Flow boxes */
.flow-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 20px;text-align:center;font-size:12px;position:relative;}
.flow-box.blue{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);font-weight:700;}
.flow-box.green{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green);font-weight:700;}
.flow-box.red{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red);font-weight:700;}
.flow-arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1.2;}

/* Progress bar */
.prog-bar-wrap{position:relative;height:48px;border-radius:8px;overflow:hidden;
  background:rgba(45,55,72,.4);border:1px solid var(--border);}
.prog-bar-fill{height:100%;border-radius:7px;display:flex;align-items:center;
  padding:0 14px;font-size:11px;font-weight:600;letter-spacing:.05em;
  transition:width 1.5s cubic-bezier(.25,.46,.45,.94);}
.prog-bar-label{position:absolute;top:50%;transform:translateY(-50%);
  font-size:10.5px;font-weight:600;pointer-events:none;}

/* Metric cards grid */
.metrics-grid{display:grid;gap:10px;}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;display:flex;flex-direction:column;gap:4px;}
.mc-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.mc-val{font-family:var(--fm);font-size:18px;font-weight:700;}

/* Model accuracy bar */
.acc-bar-wrap{display:flex;align-items:center;gap:10px;}
.acc-bar-bg{flex:1;height:6px;background:rgba(45,55,72,.6);border-radius:3px;overflow:hidden;}
.acc-bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.25,.46,.45,.94);}

/* Comparison columns */
.cmp-col{flex:1;border-radius:12px;padding:16px;border:1px solid;}
.cmp-col.bad{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);}
.cmp-col.good{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06);}
.cmp-col h4{font-family:var(--fh);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:12px;}

/* Candle SVG */
.candle-wrap{display:flex;justify-content:center;align-items:center;}

/* Vote boxes */
.vote-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 16px;display:flex;align-items:center;gap:12px;transition:all .4s;}
.vote-box.long{border-color:var(--green);background:rgba(16,185,129,.08);}
.vote-box.short{border-color:var(--red);background:rgba(239,68,68,.08);}
.vote-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;
  letter-spacing:.08em;}
.vote-badge.long{background:var(--green);color:#fff;}
.vote-badge.short{background:var(--red);color:#fff;}

/* Gauge */
.gauge-wrap{position:relative;width:280px;height:160px;margin:0 auto;}

/* Equity curve */
#equity-svg path{stroke-dasharray:3000;stroke-dashoffset:3000;
  transition:stroke-dashoffset 2.5s cubic-bezier(.25,.46,.45,.94);}
#equity-svg path.drawn{stroke-dashoffset:0;}

/* Version table champion row */
.champ-row td{color:var(--gold) !important;font-weight:700 !important;}
.champ-row td:first-child::after{content:' ★';color:var(--gold);}

/* Safety net cards */
.safety-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);}
.safety-title{font-family:var(--fh);font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}

/* CNN grid */
.cnn-grid{display:grid;gap:3px;}
.cnn-cell{width:28px;height:28px;border-radius:4px;background:rgba(45,55,72,.5);
  border:1px solid var(--border);transition:all .3s;display:flex;align-items:center;
  justify-content:center;font-size:7px;color:var(--muted);}
.cnn-cell.active{background:rgba(59,130,246,.3);border-color:var(--blue);}
.cnn-cell.kernel{background:rgba(59,130,246,.6);border-color:var(--blue);
  box-shadow:0 0 12px var(--blue-glow);}

/* LSTM cells */
.lstm-chain{display:flex;gap:6px;align-items:center;}
.lstm-cell{background:var(--card);border:1px solid var(--border);
  border-radius:8px;width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;font-size:9px;color:var(--muted);transition:all .4s;
  flex-shrink:0;text-align:center;line-height:1.3;}
.lstm-cell.active{border-color:var(--blue);background:var(--blue-dim);
  color:var(--blue);box-shadow:0 0 14px var(--blue-glow);}
.lstm-cell.done{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08);
  color:var(--green);}

/* Sliding window boxes */
.sw-box{width:32px;height:32px;border-radius:5px;background:rgba(45,55,72,.5);
  border:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:9px;color:var(--muted);
  transition:all .35s;flex-shrink:0;}
.sw-box.active{background:rgba(59,130,246,.3);border-color:var(--blue);
  color:var(--blue);box-shadow:0 0 10px var(--blue-glow);}
.sw-box.target{background:rgba(245,158,11,.2);border-color:var(--gold);
  color:var(--gold);}

/* Tooltip */
.tooltip{position:absolute;background:var(--card2);border:1px solid var(--blue);
  border-radius:6px;padding:6px 10px;font-size:10px;color:var(--blue);
  pointer-events:none;white-space:nowrap;z-index:10;}

/* Step inner container */
.step-inner{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:4px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="phases" id="phases"></div>
  <div class="header-row">
    <div style="width:100px"></div>
    <div class="step-heading" id="stepHeading"></div>
    <div class="step-counter" id="stepCounter"></div>
  </div>
  <div class="content-area" id="contentArea">
    <div class="step-wrapper" id="stepWrapper"></div>
  </div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← PREV</button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">NEXT →</button>
  </div>
</div>

<script>
// ============================================================
// PHASES
// ============================================================
const PHASES = [
  'Data Collection',
  'Feature Engineering',
  'Preprocessing',
  'Model Architecture',
  'Training & Ensemble',
  'Backtest Logic'
];

// ============================================================
// HELPERS
// ============================================================
function fu(delay=0,extra=''){
  return `style="opacity:0;animation:fadeUp .5s ease ${delay}ms forwards;${extra}"`;
}
function card(cls='',content='',delay=0){
  return `<div class="card ${cls} fu" ${fu(delay)}>${content}</div>`;
}
function lbl(t){return `<div class="lbl">${t}</div>`;}
function statCard(label,value,sub='',color='',delay=0){
  return `<div class="stat-card" ${fu(delay)}>
    <div class="sc-lbl" style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">${label}</div>
    <div class="sc-val" style="font-family:var(--fm);font-size:20px;font-weight:700;${color?'color:'+color:''}">${value}</div>
    ${sub?`<div style="font-size:10px;color:var(--muted);margin-top:3px;">${sub}</div>`:''}
  </div>`;
}

// Seeded random for equity curve
function seeded(s){let x=Math.sin(s+1)*10000;return x-Math.floor(x);}

function generateEquityCurve(pts=200){
  let eq=1000; const arr=[eq];
  // We'll scale at end
  for(let i=1;i<pts;i++){
    const r=seeded(i*7+13);
    const isWin=r<0.5204;
    const tier=eq<1500?750:eq<3000?1000:eq<5000?1300:1600;
    // velocity
    const recentWins=arr.slice(Math.max(0,arr.length-20)).filter((v,j,a)=>j>0&&v>a[j-1]).length;
    const recentLen=Math.min(20,arr.length);
    const wr=recentLen>0?recentWins/recentLen:0.5;
    const vel=Math.min(2,Math.max(0.3,1+(wr-0.5)*4));
    const bet=tier*vel*0.0018;
    const change=isWin?bet*(0.6+seeded(i*3)*0.8):-bet*(0.5+seeded(i*5)*0.7);
    eq=Math.max(700,eq+change);
    arr.push(eq);
  }
  // Scale so last point is near 4822
  const cur=arr[arr.length-1];
  const factor=(4822-1000)/(cur-1000);
  return arr.map((v,i)=>i===0?1000:Math.max(600,1000+(v-1000)*factor));
}

// ============================================================
// STEP DEFINITIONS
// ============================================================
const STEPS = [

// ── STEP 0 ── Raw BTC Data
{phase:0, heading:'Raw BTC Market Data',
render(){return `<div class="step-inner">
  <div ${fu(0)} style="width:100%;max-width:840px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
    <table class="dtbl" style="width:100%;">
      <thead><tr>
        <th>TIMESTAMP</th><th>OPEN</th><th>HIGH</th><th>LOW</th>
        <th>CLOSE</th><th>VOLUME</th>
      </tr></thead>
      <tbody id="raw-tbody">
        <tr class="stagger"><td>2023-01-01 00:00 UTC</td><td>16,541.2</td><td class="hc">16,557.8</td><td class="rc">16,528.0</td><td class="gc">16,549.3</td><td class="mc">342.81</td></tr>
        <tr class="stagger"><td>2023-01-01 00:15 UTC</td><td>16,549.3</td><td class="hc">16,572.1</td><td class="rc">16,540.0</td><td class="gc">16,563.7</td><td class="mc">289.44</td></tr>
        <tr class="stagger"><td>2023-01-01 00:30 UTC</td><td>16,563.7</td><td class="hc">16,580.2</td><td class="rc">16,551.4</td><td class="gc">16,571.0</td><td class="mc">301.22</td></tr>
        <tr class="stagger"><td>2023-01-01 00:45 UTC</td><td>16,571.0</td><td class="hc">16,590.5</td><td class="rc">16,558.8</td><td class="gc">16,565.4</td><td class="mc">278.90</td></tr>
        <tr class="stagger"><td>2023-01-01 01:00 UTC</td><td>16,565.4</td><td class="hc">16,576.3</td><td class="rc">16,541.1</td><td class="gc">16,548.9</td><td class="mc">264.17</td></tr>
        <tr class="stagger" style="opacity:.4"><td colspan="6" style="text-align:center;color:var(--muted);font-size:11px;">... ~275,000 rows total ...</td></tr>
      </tbody>
    </table>
  </div>
  <div style="display:flex;gap:12px;justify-content:center;" ${fu(100)}>
    ${statCard('TOTAL ROWS','~275,000','candles','var(--blue)',0)}
    ${statCard('TIME RANGE','~2 YEARS','15-min BTC/USDT','var(--text)',0)}
    ${statCard('FILE SIZE','~38 MB','CSV format','var(--muted)',0)}
  </div>
  <div ${fu(200)} style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:10px 20px;text-align:center;font-size:11px;color:var(--muted);">
    1 candle = 15 min &nbsp;·&nbsp; 4 candles = 1 hour &nbsp;·&nbsp; 96 candles = 1 day
  </div>
</div>`;},
onMount(){
  let i=0;
  const rows=document.querySelectorAll('#raw-tbody tr.stagger');
  function showNext(){if(i<rows.length){rows[i].classList.add('show');i++;setTimeout(showNext,120);}}
  setTimeout(showNext,300);
}},

// ── STEP 1 ── Train/Test Split
{phase:0, heading:'Chronological Train / Test Split',
render(){return `<div class="step-inner">
  <div ${fu(0)} style="width:100%;max-width:860px;">
    <div style="margin-bottom:8px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);">
      <span>Jan 2021</span><span style="color:var(--blue);">~Oct 2024</span><span>Feb 2025</span>
    </div>
    <div class="prog-bar-wrap" style="height:54px;display:flex;border-radius:10px;overflow:hidden;background:rgba(45,55,72,.3);border:1px solid var(--border);">
      <div id="train-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#1d4ed8,var(--blue));
        display:flex;align-items:center;padding:0 18px;font-size:11.5px;font-weight:700;
        color:#fff;transition:width 1.6s cubic-bezier(.25,.46,.45,.94);white-space:nowrap;min-width:0;overflow:hidden;">
        <span id="train-lbl" style="opacity:0;transition:opacity .5s .8s;">TRAINING DATA — 240,000 candles — 83%</span>
      </div>
      <div id="test-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#b45309,var(--gold));
        display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:700;
        color:var(--bg);transition:width 1.6s cubic-bezier(.25,.46,.45,.94) .1s;white-space:nowrap;min-width:0;overflow:hidden;">
        <span id="test-lbl" style="opacity:0;transition:opacity .5s .9s;">TEST — 35,903 — 17%</span>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:14px;justify-content:center;width:100%;max-width:860px;" ${fu(200)}>
    <div class="card hl" style="flex:1;">
      <div class="lbl" style="color:var(--blue);">TRAINING SET</div>
      <div style="font-size:22px;font-weight:700;color:var(--blue);margin:4px 0;">240,000 candles</div>
      <div style="font-size:11px;color:var(--muted);">83% of data &nbsp;·&nbsp; Used to TEACH the models</div>
    </div>
    <div class="card gd" style="flex:1;">
      <div class="lbl" style="color:var(--gold);">TEST SET</div>
      <div style="font-size:22px;font-weight:700;color:var(--gold);margin:4px 0;">35,903 candles</div>
      <div style="font-size:11px;color:var(--muted);">17% of data &nbsp;·&nbsp; NEVER seen by models during training</div>
    </div>
  </div>
  <div ${fu(350)} style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);
    border-radius:10px;padding:12px 20px;max-width:700px;text-align:center;">
    <div style="color:var(--gold);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;">WHY NOT RANDOM SPLIT?</div>
    <div style="font-size:11.5px;color:var(--text);line-height:1.7;">
      Financial data is time-ordered. Random split = future data leaks into training.<br>
      <strong style="color:var(--gold);">Rule:</strong> Always split by time — train on the past, test on the future.
    </div>
  </div>
</div>`;},
onMount(){
  setTimeout(()=>{
    const t=document.getElementById('train-bar');
    const ts=document.getElementById('test-bar');
    if(t){t.style.width='83%';document.getElementById('train-lbl').style.opacity='1';}
    if(ts){ts.style.width='17%';document.getElementById('test-lbl').style.opacity='1';}
  },200);
}},

// ── STEP 2 ── Why Not Raw Prices
{phase:1, heading:'Raw Prices Are Not Comparable Across Time',
render(){return `<div class="step-inner">
  <div style="display:flex;gap:16px;width:100%;max-width:860px;" ${fu(0)}>
    <div class="cmp-col bad" style="flex:1;">
      <h4 style="color:var(--red);">✗ RAW PRICE (Bad for ML)</h4>

  const pts=curve.map((v,i)=>{
    const x=pad+(i/(curve.length-1))*(W-pad*2);
    const y=H-pad-(v-minEq)/range*(H-pad*2);
    return `${x},${y}`;
  });
  const pathD='M'+pts.join(' L');
  // Find peak index
  const peakIdx=curve.indexOf(maxEq);
  const peakX=pad+(peakIdx/(curve.length-1))*(W-pad*2);
  const peakY=H-pad-(maxEq-minEq)/range*(H-pad*2);

  return `<div class="step-inner">
    <!-- Equity curve -->
    <div ${fu(0)} style="width:100%;max-width:800px;background:var(--card);
      border:1px solid var(--border);border-radius:14px;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;">EQUITY CURVE — v9 CHAMPION</div>
        <div style="display:flex;gap:16px;">
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);">
            <div style="width:18px;height:2px;background:var(--green);border-radius:1px;"></div>Portfolio
          </div>
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--blue);">
            <div style="width:18px;height:1px;background:var(--blue);border-radius:1px;border-top:1px dashed var(--blue);"></div>Start $1,000
          </div>
        </div>
      </div>
      <svg id="equity-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;">
        <!-- Start line -->
        <line x1="${pad}" y1="${H-pad-(1000-minEq)/range*(H-pad*2)}" 
              x2="${W-pad}" y2="${H-pad-(1000-minEq)/range*(H-pad*2)}"
              stroke="var(--blue)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
        <!-- Area fill -->
        <path d="${pathD} L${W-pad},${H-pad} L${pad},${H-pad} Z" 
              fill="url(#eq-grad)" opacity="0.3" id="eq-area"/>
        <!-- Equity line -->
        <path d="${pathD}" stroke="var(--green)" stroke-width="2.5" fill="none" id="eq-line"/>
        <!-- Peak dot -->
        <circle id="peak-dot" cx="${peakX}" cy="${peakY}" r="5" fill="var(--gold)" opacity="0" 
                stroke="var(--bg)" stroke-width="2"/>
        <text id="peak-lbl" x="${Math.min(peakX+8,W-60)}" y="${peakY-8}" 
              fill="var(--gold)" font-size="9" font-family="JetBrains Mono" opacity="0">
          PEAK $${Math.round(maxEq).toLocaleString()}
        </text>
        <!-- End dot -->
        <circle cx="${W-pad}" cy="${H-pad-(4822-minEq)/range*(H-pad*2)}" r="5" 
                fill="var(--green)" id="end-dot" opacity="0" stroke="var(--bg)" stroke-width="2"/>
        <defs>
          <linearGradient id="eq-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <!-- X axis labels -->
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px;">
        <span>Day 0</span><span>Day 93</span><span>Day 187</span><span>Day 280</span><span>Day 374</span>
      </div>
    </div>
    <!-- Metrics grid -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:800px;" ${fu(200)}>
      ${[
        {l:'FINAL EQUITY',v:'$4,822',c:'var(--green)'},
        {l:'TOTAL RETURN',v:'+382%',c:'var(--gold)'},
        {l:'WIN RATE',v:'52.04%',c:'var(--blue)'},
        {l:'MAX DRAWDOWN',v:'8.47%',c:'var(--red)'},
        {l:'PROFIT FACTOR',v:'1.144',c:'var(--text)'},
      ].map(({l,v,c},i)=>`
        <div class="card" ${fu(i*80+300)} style="text-align:center;border-color:${c}22;">
          <div class="lbl">${l}</div>
          <div style="font-size:18px;font-weight:700;color:${c};margin-top:4px;">${v}</div>
        </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:800px;" ${fu(500)}>
      <div class="card">
        <div class="lbl" style="margin-bottom:8px;">ML ACCURACY (all candles)</div>
        ${[['Accuracy','51.91%','var(--blue)'],['Precision','0.5166','var(--muted)'],['Recall','0.6113','var(--muted)'],['F1','0.5600','var(--muted)']].map(([l,v,c])=>`
        <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(45,55,72,.3);">
          <span style="color:var(--muted);">${l}</span><span style="color:${c};font-weight:700;">${v}</span>
        </div>`).join('')}
      </div>
      <div class="card gn">
        <div class="lbl" style="color:var(--green);margin-bottom:8px;">AFTER CONSENSUS GATE</div>
        ${[['Accuracy','52.06%','var(--green)'],['Precision','0.5185','var(--green)'],['Recall','0.7657','var(--green)'],['F1','0.6183','var(--green)']].map(([l,v,c])=>`
        <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(16,185,129,.15);">
          <span style="color:var(--muted);">${l}</span><span style="color:${c};font-weight:700;">${v}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;},
onMount(){
  // Animate equity curve
  const line=document.getElementById('eq-line');
  const area=document.getElementById('eq-area');
  const peak=document.getElementById('peak-dot');
  const peakLbl=document.getElementById('peak-lbl');
  const endDot=document.getElementById('end-dot');
  if(line){
    const len=line.getTotalLength()||2500;
    line.style.strokeDasharray=len;
    line.style.strokeDashoffset=len;
    setTimeout(()=>{
      line.style.transition=`stroke-dashoffset 2.5s cubic-bezier(.25,.46,.45,.94)`;
      line.style.strokeDashoffset='0';
    },300);
    setTimeout(()=>{
      if(peak){peak.style.opacity='1';peak.style.transition='opacity .4s';}
      if(peakLbl){peakLbl.style.opacity='1';peakLbl.style.transition='opacity .4s';}
      if(endDot){endDot.style.opacity='1';endDot.style.transition='opacity .4s';}
    },2900);
  }
  if(area){area.style.opacity='0';setTimeout(()=>{area.style.transition='opacity 1.5s ease 1s';area.style.opacity='0.3';},400);}
}},
];

// ============================================================
// PHASE STEP RANGES
// ============================================================
// Phase 0: steps 0-1
// Phase 1: steps 2-4
// Phase 2: steps 5-6
// Phase 3: steps 7-10
// Phase 4: steps 11-13
// Phase 5: steps 14-19
const PHASE_RANGES=[[0,1],[2,4],[5,6],[7,10],[11,13],[14,19]];

function getPhaseForStep(i){
  for(let p=0;p<PHASE_RANGES.length;p++){
    if(i>=PHASE_RANGES[p][0]&&i<=PHASE_RANGES[p][1])return p;
  }
  return 0;
}

// ============================================================
// STATE & NAV
// ============================================================
let current=0;
let busy=false;
let mountTimer=null;

function renderPhases(){
  const el=document.getElementById('phases');
  const phase=getPhaseForStep(current);
  el.innerHTML=PHASES.map((p,i)=>
    `<button class="phase-pill${i===phase?' active':''}" onclick="jumpToPhase(${i})">${p}</button>
     ${i<PHASES.length-1?'<span class="phase-sep">›</span>':''}`
  ).join('');
}

function renderNavDots(){
  const el=document.getElementById('navDots');
  el.innerHTML=STEPS.map((_,i)=>
    `<div class="nav-dot${i===current?' active':''}" onclick="goTo(${i})"></div>`
  ).join('');
}

function renderButtons(){
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===STEPS.length-1;
}

function renderStep(idx,dir=1){
  const step=STEPS[idx];
  document.getElementById('stepHeading').textContent=step.heading;
  document.getElementById('stepCounter').textContent=`Step ${idx+1} of ${STEPS.length}`;
  
  const wrapper=document.getElementById('stepWrapper');
  wrapper.innerHTML=step.render();
  wrapper.className='step-wrapper '+(dir>=0?'anim-in-r':'anim-in-l');

  // Add stat-card style (inline)
  document.querySelectorAll('.stat-card').forEach(sc=>{
    sc.style.cssText+=`background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center;min-width:150px;`;
  });

  if(mountTimer)clearTimeout(mountTimer);
  mountTimer=setTimeout(()=>{step.onMount&&step.onMount();},50);
}

function goTo(idx,dir){
  if(busy||idx===current||idx<0||idx>=STEPS.length)return;
  busy=true;
  if(dir===undefined)dir=idx>current?1:-1;
  
  const wrapper=document.getElementById('stepWrapper');
  wrapper.className='step-wrapper '+(dir>0?'anim-out-l':'anim-out-r');
  
  setTimeout(()=>{
    current=idx;
    renderStep(current,dir);
    renderPhases();
    renderNavDots();
    renderButtons();
    setTimeout(()=>{busy=false;},400);
  },270);
}

function navigate(dir){
  goTo(current+dir,dir);
}

function jumpToPhase(p){
  goTo(PHASE_RANGES[p][0],p>getPhaseForStep(current)?1:-1);
}

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')navigate(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')navigate(-1);
});

// Init
renderPhases();
renderNavDots();
renderButtons();
renderStep(0,1);
</script>
</body>
</html>
